[package]
name = "khmer-engine"
version = "0.1.0"
license = "MIT"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Optional convenience for standalone native users. Mobile supplies its own pair.
bundled-dictionaries = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"

[build-dependencies]
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.104"
